<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLink - Profile</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="navbar">
    <h2>My Profile</h2>
    <a href="dashboard.html">⬅ Back</a>
</header>

<div class="container">

    <div class="profile-card">

        <div class="profile-avatar">
            👤
        </div>

        <h2 id="profileName">User</h2>
        <p id="profileEmail">Email</p>

        <input type="text" id="fullName" placeholder="Full Name">

        <input type="email" id="email" placeholder="Email" readonly>

        <input type="tel" id="phone" placeholder="Phone Number">

        <input type="text" id="bloodGroup" placeholder="Blood Group">

        <textarea id="medicalInfo" placeholder="Medical Information"></textarea>

        <button class="btn" onclick="saveProfile()">
            Save Changes
        </button>

    </div> <!-- profile-card -->

</div> <!-- THIS WAS MISSING -->

<div class="container">

    <h3>Settings</h3>

    <div class="card">🔐 Privacy Settings</div>

    <div class="card">🔔 Notification Settings</div>

    <div class="card">❓ Help & Support</div>

    <div class="card">🚪 Logout</div>

</div>


<script src="js/config.js"></script>
<script src="./js/profile.js"></script>

</body>
</html>
