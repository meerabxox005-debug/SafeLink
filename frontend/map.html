<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLink - Live Location</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e53935">
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>

<header class="navbar">
    <h2>Live Location</h2>
    <a href="dashboard.html">⬅ Back</a>
</header>

<div class="container">

    <h3>Your Current Location</h3>

    <div id="map"
style="
height:400px;
width:100%;
border-radius:12px;
margin-top:15px;
">
</div>

<p id="locationText"></p>

<br>

<button class="btn" onclick="getLocation()">
📍 Show My Live Location
</button>

</div>

<div class="container">

    <h3>Nearby Emergency Services</h3>

    <div class="card">🚓 Police Station</div>
    <div class="card">🏥 Hospital</div>
    <div class="card">🚒 Fire Station</div>
    <div class="card">💊 Pharmacy</div>

</div>

<script src="js/config.js"></script>
<script src="./js/map.js"></script>
<script src="./js/theme.js"></script>

</body>
</html>
